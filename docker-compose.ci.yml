services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: fttw_ci
      POSTGRES_USER: fttw_ci
      POSTGRES_PASSWORD: fttw_ci_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fttw_ci -d fttw_ci"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fttw_ci:fttw_ci_only@postgres:5432/fttw_ci
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      FTTW_ENV: ci
      SEED_DEMO_DATA: "true"
      DATA_ROOT: /tmp/fttw-ci-data
      FTTW_SERVICE_NAME: backend
      ENABLE_DATABASE_RESTORE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp/fttw-ci-data
    volumes:
      - ./.ci-artifacts:/artifacts

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://backend:8000/api
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend
    depends_on:
      - backend
    volumes:
      - ./.ci-artifacts:/artifacts

  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      CI: "true"
      E2E_BASE_URL: http://frontend:3000
      E2E_API_BASE_URL: http://backend:8000/api
      E2E_VIEWER_USERNAME: viewer
      E2E_VIEWER_PASSWORD: Viewer123!
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: Admin123!
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: /artifacts/e2e-junit.xml
    depends_on:
      - frontend
      - backend
    volumes:
      - ./.ci-artifacts:/artifacts
